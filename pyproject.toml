[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"


[project]
name = "lingextract-plus-plus"
version = "2.0.0"
description = "Ling Extract Plus Plus: opinionated fork of LangExtract for grounded extraction"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "Akshay Goel", email = "goelak@google.com"}
]
dependencies = [
    "google-genai>=1.63.0",
    "google-cloud-storage>=2.14.0",
    "httpx>=0.28.0",
    "more-itertools>=8.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=0.19.0",
    "PyYAML>=6.0",
    "regex>=2023.0.0",
    "tqdm>=4.64.0",
    "pymupdf>=1.27.1",
]

[project.urls]
"Homepage" = "https://github.com/google/langextract"
"Repository" = "https://github.com/google/langextract"
"Documentation" = "https://github.com/google/langextract/blob/main/README.md"
"Bug Tracker" = "https://github.com/google/langextract/issues"
"Changelog" = "https://github.com/google/langextract/releases"
"DOI" = "https://doi.org/10.5281/zenodo.17015089"

[project.optional-dependencies]
openai = ["openai>=1.50.0"]
all = ["openai>=1.50.0"]
dev = [
    "pytype>=2024.10.11",
    "ruff==0.15.1",
    "tox>=4.0.0",
    "import-linter>=2.0",
    "pre-commit>=3.5.0",
    "types-regex>=2023.0.0",
]
test = [
    "pytest>=7.4.0",
    "tomli>=2.0.0",
    "absl-py>=1.0.0",
    "numpy>=1.20.0",
]
notebook = [
    "ipython>=7.0.0",
    "notebook>=6.0.0"
]

# Provider discovery mechanism for built-in and third-party providers
[project.entry-points."langextract.providers"]
gemini = "langextract.providers.gemini:GeminiLanguageModel"
ollama = "langextract.providers.ollama:OllamaLanguageModel"
openai = "langextract.providers.openai:OpenAILanguageModel"

[tool.hatch.build.targets.wheel]
packages = ["langextract"]
exclude = [
    "langextract/**/*.gif",
    "langextract/**/*.svg",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/**",
    "tests/**",
    "kokoro/**",
    "**/*.gif",
    "**/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "*_test.py"
python_classes = "Test*"
python_functions = "test_*"
# Show extra test summary info
addopts = "-ra"
markers = [
    "live_api: marks tests as requiring live API access",
    "vertex_ai: marks tests requiring Vertex AI credentials",
    "integration: marks integration tests that test multiple components together",
]
filterwarnings = [
    # Upstream google-genai uses typing._UnionGenericAlias (deprecated in 3.14, removal in 3.17)
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["langextract", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Explicit strict set, based on Ruff's recommended incremental categories.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.importlinter]
root_package = "langextract"


[[tool.importlinter.contracts]]
name = "Providers must not import inference"
type = "forbidden"
source_modules = ["langextract.providers"]
forbidden_modules = ["langextract.inference"]

[[tool.importlinter.contracts]]
name = "Core must not import providers"
type = "forbidden"
source_modules = ["langextract.core"]
forbidden_modules = ["langextract.providers"]

[[tool.importlinter.contracts]]
name = "Core must not import high-level modules"
type = "forbidden"
source_modules = ["langextract.core"]
forbidden_modules = [
  "langextract.annotation",
  "langextract.chunking",
  "langextract.prompting",
  "langextract.resolver",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "ty>=0.0.17",
]
