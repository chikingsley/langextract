[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"


[project]
name = "lingextract-plus-plus"
version = "2.0.0"
description = "Ling Extract Plus Plus: opinionated fork of LangExtract for grounded extraction"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    {name = "Chi Ejimofor", email = "chi@peacockery.studio"}
]
dependencies = [
    "google-cloud-storage>=2.14.0",
    "google-genai>=1.65.0",
    "httpx>=0.28.0",
    "more-itertools>=8.0.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.24.2",
    "openai>=2.24.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.27.1",
    "python-dotenv>=0.19.0",
    "PyYAML>=6.0",
    "rapidocr>=3.7.0",
    "regex>=2026.2.28",
    "tqdm>=4.64.0",
]

[project.urls]
"Homepage" = "https://github.com/google/langextract"
"Repository" = "https://github.com/google/langextract"
"Documentation" = "https://github.com/google/langextract/blob/main/README.md"
"Bug Tracker" = "https://github.com/google/langextract/issues"
"Changelog" = "https://github.com/google/langextract/releases"
"DOI" = "https://doi.org/10.5281/zenodo.17015089"

[project.scripts]
langextract-cli = "langextract.cli:main"

[project.entry-points."langextract.providers"]
gemini = "langextract.providers.gemini:GeminiLanguageModel"
ollama = "langextract.providers.ollama:OllamaLanguageModel"
openai = "langextract.providers.openai:OpenAILanguageModel"

[tool.hatch.build.targets.wheel]
packages = ["langextract"]
exclude = [
    "langextract/**/*.gif",
    "langextract/**/*.svg",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/**",
    "tests/**",
    "kokoro/**",
    "**/*.gif",
    "**/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra"
markers = [
    "live_api: marks tests as requiring live API access",
    "vertex_ai: marks tests requiring Vertex AI credentials",
    "integration: marks integration tests that test multiple components together",
]
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["langextract", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with task-tracking comments
    "NPY",      # Some numpy-specific things
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "RUF001",   # Ambiguous Unicode is intentional test data (en-dashes, Cyrillic, etc.)
    "RUF012",   # Mutable class-level defaults are fine in test classes
]

[tool.importlinter]
root_package = "langextract"


[[tool.importlinter.contracts]]
name = "Core must not import providers"
type = "forbidden"
source_modules = ["langextract.core"]
forbidden_modules = ["langextract.providers"]

[[tool.importlinter.contracts]]
name = "Core must not import high-level modules"
type = "forbidden"
source_modules = ["langextract.core"]
forbidden_modules = [
  "langextract.annotation",
  "langextract.chunking",
  "langextract.prompting",
  "langextract.resolver",
]

[dependency-groups]
dev = [
    "absl-py>=1.0.0",
    "import-linter>=2.0",
    "matplotlib>=3.10.8",
    "pre-commit>=3.5.0",
    "pytest>=7.4.0",
    "ruff==0.15.1",
    "tox>=4.0.0",
    "ty>=0.0.17",
    "types-regex>=2023.0.0",
]
