[tox]
envlist = py314, format, lint, lint-arch
skip_missing_interpreters = True

[testenv]
setenv =
    PYTHONWARNINGS = ignore
deps =
    -e .
    absl-py>=1.0.0
    pytest>=7.4.0
commands =
    pytest -ra -m "not live_api and not requires_pip"

[testenv:format]
skip_install = true
deps =
    ruff==0.15.1
commands =
    ruff format --check langextract tests

[testenv:lint]
deps =
    ruff==0.15.1
commands =
    ruff check langextract tests

[testenv:lint-arch]
deps =
    import-linter>=2.0
commands =
    lint-imports

[testenv:live-api]
basepython = python3.14
passenv =
    GEMINI_API_KEY
    OPENAI_API_KEY
    OPENROUTER_API_KEY
    OPENROUTER_BASE_URL
    OPENROUTER_MODEL
    GOOGLE_APPLICATION_CREDENTIALS
    GOOGLE_CLOUD_PROJECT
commands =
    pytest tests/test_live_api.py -v -m live_api --maxfail=1

[testenv:ollama-integration]
basepython = python3.14
passenv =
    OLLAMA_BASE_URL
    OLLAMA_TEST_MODEL
deps =
    {[testenv]deps}
    requests>=2.25.0
commands =
    pytest tests/test_ollama_integration.py -v --tb=short

[testenv:plugin-integration]
basepython = python3.14
setenv =
    PIP_NO_INPUT = 1
    PIP_DISABLE_PIP_VERSION_CHECK = 1
commands =
    pytest tests/provider_plugin_test.py::TestPluginE2E -v -m "requires_pip"

[testenv:plugin-smoke]
basepython = python3.14
commands =
    pytest tests/provider_plugin_test.py::TestPluginSmoke -v

[testenv:deadcode]
skip_install = true
deps =
    vulture>=2.11
commands =
    vulture langextract pdfextract --min-confidence 85
